spring.application.name=backend

#Image limit:-
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


#JPA:-
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


#OAuth:-
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID_OAUTH}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_PASS_OAUTH}
spring.security.oauth2.client.registration.google.scope=email,profile


#Mail:-
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Essential for Java 17+ / Angus Mail
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

#Backend:-
app.frontend-url=${FRONTEND_URL}
app.backend-url=${BACKEND_URL}
jwt.secret=${JWT_SEC}
server.forward-headers-strategy=framework
server.port=${PORT:8080}
spring.jpa.open-in-view=false


#Logs:-
logging.level.root=INFO
logging.level.com.arpan.backend=DEBUG
logging.file.name=app.log/backend.logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] [%thread] %logger - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
# Number of days:-
logging.logback.rollingpolicy.max-history=7
